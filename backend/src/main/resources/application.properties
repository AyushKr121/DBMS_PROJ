spring.config.import=optional:file:.env[.properties]

spring.application.name=backend

# TiDB Cloud
spring.datasource.url=jdbc:mysql://${TIDB_HOST}:${TIDB_PORT}/${TIDB_DATABASE}?sslMode=VERIFY_IDENTITY
spring.datasource.username=${TIDB_USERNAME}
spring.datasource.password=${TIDB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# SQL initialization
spring.sql.init.mode=always

# Spring Session JDBC
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# Session timeout
server.servlet.session.timeout=7d

# Persistent session cookie
server.servlet.session.cookie.max-age=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/